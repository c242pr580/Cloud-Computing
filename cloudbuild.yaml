steps:

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/serabutinn-model-nlp/serabutinn-model-nlp', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/serabutinn-model-nlp/serabutinn-model-nlp']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'serabutinn-model-nlp'
      - '--image'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/serabutinn-model-nlp/serabutinn-model-nlp'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'PROJECT_ID=${PROJECT_ID}'
      - '--set-secrets'
      - 'NLP_MODEL=NLP_MODEL:latest,VOCAB=VOCAB:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-southeast2

images:
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/serabutinn-model-nlp/serabutinn-model-nlp'
